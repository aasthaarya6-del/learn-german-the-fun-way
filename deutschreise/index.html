<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deutschreise — Learn German the Fun Way</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#2f2854;
  --ink-soft:#5c5478;
  --card:#fffdf8;
  --sky:#7ec8ef;
  --sun:#ffd45c;
  --peach:#f08a72;
  --berry:#e85a9a;
  --grass:#3db89a;
  --grape:#6d5ce0;
  --leaf:#6fcf7a;
  --shadow: 4px 4px 0 rgba(47,40,84,0.16);
  --rainbow:linear-gradient(90deg,#ff7eab 0%,#ffb15c 16%,#ffe14a 33%,#6edc9c 50%,#5cc4f0 66%,#8a6ef0 83%,#f07ac4 100%);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  min-height:100vh;
  color:var(--ink);
  font-family:'Nunito',sans-serif;
  background:
    linear-gradient(180deg, rgba(255,126,171,0.22) 0%, rgba(255,225,74,0.18) 18%, transparent 36%),
    radial-gradient(ellipse at 18% 8%, rgba(255,236,210,0.95) 0 180px, transparent 181px),
    radial-gradient(ellipse at 88% 12%, rgba(255,214,232,0.7) 0 200px, transparent 201px),
    linear-gradient(180deg,#f4ecff 0%,#fff6e8 42%,#eaf6ff 100%);
}
body::before,body::after{
  position:fixed;pointer-events:none;z-index:0;line-height:1;
}
body::before{
  content:"🦄";
  top:14px;left:12px;font-size:44px;opacity:0.28;
}
body::after{
  content:"🌈";
  bottom:16px;right:12px;font-size:48px;opacity:0.3;
}
.wrap{max-width:920px;margin:0 auto;padding:22px 16px 80px;position:relative;z-index:1;}
.wrap::before{
  content:"✨  🦄  🌈  ✨";
  display:block;text-align:center;letter-spacing:0.55em;
  font-size:16px;margin:0 0 12px;opacity:0.72;
}

.masthead{
  display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
  background:
    linear-gradient(var(--card),var(--card)) padding-box,
    var(--rainbow) border-box;
  border:4px solid transparent;border-radius:28px;
  padding:16px 20px;box-shadow:var(--shadow);margin-bottom:16px;
}
.masthead h1{
  font-family:'Fredoka',sans-serif;font-weight:700;font-size:clamp(28px,6vw,44px);
  margin:0;letter-spacing:-0.5px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;
}
.masthead h1 span{color:var(--berry);}
.masthead .sub{font-size:15px;color:var(--ink-soft);font-weight:700;margin-top:4px;}
.otto{
  margin:8px 0 16px;padding:10px 14px;background:#fff8ef;
  border:2px dashed #e8c9a8;border-radius:18px;
  font-size:15px;font-weight:700;line-height:1.45;
}
.otto strong{color:#c47a3a;}
.buddy{
  font-size:52px;line-height:1;filter:drop-shadow(3px 3px 0 rgba(43,37,80,0.12));
  animation:bob 2.8s ease-in-out infinite;cursor:pointer;
}
.buddies{display:flex;align-items:flex-end;gap:4px;}
.buddy.unicorn{font-size:58px;animation-delay:.4s;}
.float-notes{display:none;position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;}
body.music-on .float-notes{display:block;}
.float-notes i{
  position:absolute;bottom:-40px;font-style:normal;font-size:22px;opacity:0.38;
  animation:riseNote 10s linear infinite;color:var(--grape);
}
.float-notes i:nth-child(1){left:6%; animation-duration:11s;}
.float-notes i:nth-child(2){left:22%; animation-duration:8s; animation-delay:1.2s; font-size:18px;}
.float-notes i:nth-child(3){left:40%; animation-duration:12s; animation-delay:2s;}
.float-notes i:nth-child(4){left:58%; animation-duration:9s; animation-delay:.6s; font-size:26px;}
.float-notes i:nth-child(5){left:74%; animation-duration:10s; animation-delay:1.8s;}
.float-notes i:nth-child(6){left:88%; animation-duration:13s; animation-delay:2.4s; font-size:16px;}
@keyframes riseNote{
  0%{transform:translateY(0) rotate(0deg);opacity:0;}
  12%{opacity:0.4;}
  100%{transform:translateY(-110vh) rotate(18deg);opacity:0;}
}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.rainbowbar{
  height:10px;width:128px;border-radius:999px;overflow:hidden;margin-bottom:8px;
  border:2px solid var(--ink);
  background:var(--rainbow);
}
.flagbar{display:flex;height:10px;width:78px;border-radius:999px;overflow:hidden;margin-bottom:8px;border:2px solid var(--ink);}
.flagbar div{flex:1;}
.flagbar .b{background:#111;} .flagbar .r{background:#ff2a3a;} .flagbar .g{background:#ffe033;}

.welcomebox{
  background:#f3edff;border:3px solid var(--grape);border-radius:22px;
  padding:14px 18px;margin-bottom:16px;font-size:16px;line-height:1.55;font-weight:700;
}
.welcomebox strong{color:var(--grape);}

.overallbar{height:14px;background:#fff;border:3px solid var(--ink);border-radius:999px;overflow:hidden;margin-bottom:6px;}
.overallbar>div{height:100%;background:var(--rainbow);transition:width .4s ease;}
.progress-caption{font-size:14px;color:var(--ink-soft);font-weight:800;margin-bottom:0;}
.progress-tools{
  display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;
  margin-bottom:8px;
}
.progress-tools .btn{padding:7px 14px;font-size:13px;}

.journey{
  display:flex;overflow-x:auto;gap:12px;padding:18px 10px 22px;margin-bottom:6px;scrollbar-width:thin;
  background:#fff;
  border:3px solid var(--ink);border-radius:28px;
  box-shadow:var(--shadow);
  position:relative;
}
.journey::before{
  content:"";position:absolute;left:10px;right:10px;top:50%;height:10px;
  transform:translateY(-50%);border-radius:999px;background:var(--rainbow);opacity:0.95;
  pointer-events:none;
}
.stamp{
  flex:0 0 auto;width:102px;height:118px;
  border-radius:22px 22px 48px 48px;
  border:3px solid var(--ink);
  background:#fff;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  cursor:pointer;font-size:12px;font-weight:800;text-align:center;padding:18px 6px 10px;
  color:var(--ink); transition:transform .15s ease, border-color .15s ease, color .15s ease;
  position:relative;z-index:1;box-shadow:var(--shadow);
}
.stamp:nth-child(7n+1){background:#ffe4f0;}
.stamp:nth-child(7n+2){background:#ffe8cc;}
.stamp:nth-child(7n+3){background:#fff4b0;}
.stamp:nth-child(7n+4){background:#d4f8e4;}
.stamp:nth-child(7n+5){background:#d0f0ff;}
.stamp:nth-child(7n+6){background:#e6dcff;}
.stamp:nth-child(7n+7){background:#ffd8ee;}
.stamp:hover{transform:translateY(-4px) scale(1.04);}
.stamp .icon{font-size:26px;margin-bottom:2px;}
.stamp .stampen{font-size:10px;font-weight:700;color:inherit;opacity:0.8;margin-top:1px;}
.stamp.active{border-color:var(--berry);color:var(--berry);box-shadow:0 0 0 4px rgba(232,90,154,0.28);}
.stamp.done{color:#1f8a72;}
.stamp.done::after{
  content:"🦄";position:absolute;top:-10px;right:-4px;
  width:26px;height:26px;font-size:18px;display:flex;align-items:center;
  justify-content:center;
}
.stamp .lv{
  position:absolute;top:-8px;left:50%;transform:translateX(-50%);
  background:var(--grape);color:#fff;font-size:10px;font-weight:800;
  padding:2px 7px;border-radius:999px;border:2px solid var(--ink);white-space:nowrap;
}
.stamp.locked{opacity:0.5;cursor:not-allowed;filter:grayscale(.35);}
.stamp.locked:hover{transform:none;}
.stamp.extra{border-style:dashed;background:#fff;}
.levelchip{
  display:inline-block;font-size:13px;font-weight:800;letter-spacing:0.02em;
  background:var(--grape);color:#fff;border:2.5px solid var(--ink);border-radius:999px;
  padding:4px 12px;margin-bottom:8px;
}
.levelchip.extra{background:var(--peach);}
.lockhint{
  background:#fff3d6;border:3px dashed var(--sun);border-radius:16px;
  padding:10px 14px;margin:0 0 14px;font-weight:800;font-size:15px;
}
.level-up{
  position:fixed;inset:0;background:rgba(43,37,80,0.5);z-index:80;
  display:flex;align-items:center;justify-content:center;padding:18px;
}
.level-up-card{
  background:var(--card);border:4px solid var(--ink);border-radius:28px;
  padding:28px 22px;max-width:420px;width:100%;text-align:center;
  box-shadow:var(--shadow);animation:pop .35s ease;
}
.level-up-card .burst{font-size:52px;line-height:1;margin-bottom:8px;}
.level-up-card h3{font-family:'Fredoka',sans-serif;font-size:28px;margin:0 0 6px;}
.level-up-card p{font-weight:800;color:var(--ink-soft);margin:0 0 16px;line-height:1.45;}
@keyframes pop{from{transform:scale(.82);opacity:0}to{transform:scale(1);opacity:1}}

.card{
  background:
    linear-gradient(var(--card),var(--card)) padding-box,
    var(--rainbow) border-box;
  border:4px solid transparent;
  border-radius:28px;
  padding:24px 24px 26px;
  box-shadow:var(--shadow);
  margin-bottom:18px;
}
.card h2{font-family:'Fredoka',sans-serif;font-size:clamp(24px,4vw,34px);margin:0 0 6px;}
.card .tagline{color:var(--ink-soft);font-size:16px;margin-bottom:16px;font-weight:700;}
.section-label{
  display:inline-block;font-size:13px;letter-spacing:0.02em;font-weight:800;
  color:#fff;background:var(--grape);margin:20px 0 12px;padding:6px 12px;border-radius:999px;
  border:2px solid var(--ink);
}
.section-label:first-of-type{margin-top:4px;}

.tiles{display:flex;flex-wrap:wrap;gap:10px;}
.tile{
  display:flex;align-items:center;gap:8px;
  background:#fff;border:3px solid var(--ink);border-radius:18px;
  padding:10px 12px;cursor:pointer;font-weight:800;font-size:16px;
  transition:transform .12s ease, background .12s ease;
  box-shadow:3px 3px 0 rgba(43,37,80,0.08);
}
.tile:hover{background:#fff6d6;transform:translateY(-2px);}
.tile .en{font-weight:700;color:var(--ink-soft);font-size:13px;}
.tile.swatch{padding-left:10px;}
.swatchdot{width:18px;height:18px;border-radius:50%;border:2px solid var(--ink);display:inline-block;}

table.conj{width:100%;border-collapse:separate;border-spacing:0;margin-top:6px;font-size:16px;overflow:hidden;border-radius:16px;border:3px solid var(--ink);}
table.conj th{
  text-align:left;font-size:12px;letter-spacing:0.04em;text-transform:uppercase;
  color:#fff;background:var(--grape);padding:10px 10px;
}
table.conj td{padding:10px;border-bottom:2px solid #f0ecff;background:#fff;}
table.conj tr:last-child td{border-bottom:none;}
table.conj td.pron{font-weight:800;width:90px;}
table.conj tr:hover td{background:#fff8e8;}
.audio-td{cursor:pointer;width:44px;}

button.btn{
  font-family:'Fredoka',sans-serif;font-weight:700;font-size:16px;
  background:var(--grape);color:#fff;border:3px solid var(--ink);border-radius:999px;
  padding:11px 20px;cursor:pointer;
  box-shadow:4px 4px 0 rgba(47,40,84,0.18);
}
button.btn:hover{background:var(--berry);transform:translateY(-1px);}
button.btn.ghost{background:#fff;color:var(--ink);border:3px solid var(--ink);}
button.btn.ghost:hover{background:var(--sun);color:var(--ink);}
button.btn:disabled{opacity:0.4;cursor:not-allowed;transform:none;}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;}

.spk{
  display:inline-flex;align-items:center;justify-content:center;
  width:34px;height:34px;border-radius:50%;border:2.5px solid var(--ink);
  background:var(--sun);cursor:pointer;font-size:15px;flex:0 0 auto;
  vertical-align:middle;margin-left:4px;box-shadow:3px 3px 0 rgba(47,40,84,0.14);
}
.spk:hover{background:#ffe27a;transform:scale(1.08);}
.spk.first-spk{
  animation:pulse 1.6s ease-in-out infinite;
  background:#ffe14a;
}
@keyframes pulse{
  0%,100%{box-shadow:0 0 0 0 rgba(255,209,102,0.7)}
  50%{box-shadow:0 0 0 6px rgba(255,209,102,0)}
}
.deword{display:inline-flex;align-items:center;gap:2px;white-space:nowrap;}
.deword .de{color:var(--grape);}
.gloss{color:var(--ink-soft);font-weight:700;font-size:0.92em;white-space:normal;}

.qwrap{background:#fbf4ee;border:2px dashed #e8c9b8;border-radius:20px;padding:16px 18px;margin-top:10px;}
.qprompt{font-weight:800;font-size:18px;margin-bottom:12px;line-height:1.45;}
.qopt{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  width:100%;text-align:left;background:#fff;border:3px solid var(--ink);
  border-radius:16px;padding:11px 14px;margin-bottom:8px;cursor:pointer;font-size:16px;
  font-family:'Nunito',sans-serif;font-weight:800;
}
.qopt:hover{background:#fff3d6;}
.qopt.correct{background:#d8ffef;border-color:var(--grass);}
.qopt.incorrect{background:#ffe0ea;border-color:var(--berry);}
.qopt:disabled{cursor:default;}
.qfeedback{font-size:15px;font-weight:800;margin-top:8px;}
.qfeedback.ok{color:#0f8f84;}
.qfeedback.bad{color:var(--berry);}
.qfeedback.try{color:#b56a2c;}
.progressline{font-size:13px;color:var(--ink-soft);margin-bottom:8px;font-weight:800;}

.fillrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px;font-size:16px;font-weight:700;}
.fillrow input{
  border:3px solid var(--ink);border-radius:12px;background:#fff;
  font-family:'Fredoka',sans-serif;font-size:16px;font-weight:700;width:120px;padding:6px 8px;text-align:center;color:var(--ink);
}
.fillrow input:focus{outline:none;border-color:var(--berry);background:#fff8e8;}
.fillrow input.ok{border-color:var(--grass);color:#0f8f84;background:#edfffb;}
.fillrow input.bad{border-color:var(--berry);color:var(--berry);background:#fff0f6;}

.matchgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.matchcol{display:flex;flex-direction:column;gap:8px;}
.matchitem{
  background:#fff;border:3px solid var(--ink);border-radius:16px;padding:10px 12px;
  cursor:pointer;font-size:15px;font-weight:800;text-align:center;
  display:flex;align-items:center;justify-content:center;gap:6px;
}
.matchitem.sel{border-color:var(--sun);background:#fff3d6;}
.matchitem.paired{border-color:var(--grass);background:#d8ffef;color:#0f8f84;cursor:default;}
.matchitem.wrongflash{border-color:var(--berry);background:#ffe0ea;}

.challengetimer{
  font-family:'Fredoka',sans-serif;font-weight:700;font-size:20px;
  background:var(--ink);color:#fff;padding:8px 16px;border-radius:16px;display:inline-block;
}

.flashcard{
  background:linear-gradient(180deg,#fffefb 0%,#f6ecd4 100%);
  border:4px solid var(--ink);border-radius:28px;
  min-height:200px;display:flex;align-items:center;justify-content:center;flex-direction:column;
  cursor:pointer;font-family:'Fredoka',sans-serif;font-size:32px;text-align:center;padding:20px;
  box-shadow:var(--shadow);margin-bottom:16px;user-select:none;
}
.flashcard .hint{font-family:'Nunito',sans-serif;font-size:14px;color:var(--ink-soft);margin-top:10px;font-weight:800;}
.flashnav{display:flex;justify-content:space-between;align-items:center;font-size:15px;color:var(--ink-soft);font-weight:800;}

.passage{
  background:#fffdf8;border:2px solid #eadfc8;border-radius:20px;
  padding:22px 24px;font-size:20px;line-height:1.85;margin-bottom:12px;font-weight:600;
  text-align:justify;hyphens:auto;
}
.passage p{margin:0 0 1em;}
.passage p:last-child{margin-bottom:0;}
.story-shelf-label{font-family:'Fredoka',sans-serif;font-size:18px;margin:4px 0 8px;}
.story-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(210px,1fr));
  gap:10px;
  margin:0 0 16px;
}
.story-card{
  text-align:left;
  background:#fff;
  border:3px solid var(--ink);
  border-radius:18px;
  padding:12px 14px;
  cursor:pointer;
  font-family:'Nunito',sans-serif;
  box-shadow:3px 3px 0 rgba(43,37,80,0.08);
}
.story-card:nth-child(6n+1){background:#fff3b8;}
.story-card:nth-child(6n+2){background:#ffd6ea;}
.story-card:nth-child(6n+3){background:#c8f5dc;}
.story-card:nth-child(6n+4){background:#c8ecff;}
.story-card:nth-child(6n+5){background:#ffe0c4;}
.story-card:nth-child(6n+6){background:#e0d4ff;}
.story-card:hover{filter:brightness(1.03);transform:translateY(-2px);}
.story-card.on{border-color:var(--berry);box-shadow:0 0 0 4px rgba(232,90,154,0.25);}
.story-card .st{font-family:'Fredoka',sans-serif;font-size:16px;font-weight:700;display:block;margin-bottom:4px;}
.story-card .sb{font-size:13px;font-weight:700;color:var(--ink-soft);line-height:1.35;display:block;}
.songbox{
  background:#f7f1e8;border:2px dashed #e5d7b4;border-radius:20px;
  padding:16px 18px;margin:0 0 16px;white-space:pre-line;
  font-family:'Fredoka',sans-serif;font-size:20px;font-weight:700;line-height:1.7;
}
.glossary-panel{
  background:#f4f0f8;border:2px solid #e2d8c8;border-radius:20px;
  padding:14px 16px;margin:0 0 16px;
}
.glossary-panel h3{
  font-family:'Fredoka',sans-serif;font-size:18px;margin:0 0 4px;
}
.glossary-panel .hint{
  font-size:14px;font-weight:700;color:var(--ink-soft);margin:0 0 12px;
}
.glossary-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px 12px;
}
.glossary-item{
  display:flex;align-items:center;gap:6px;background:#fff;border:2px solid #d8d0f5;
  border-radius:12px;padding:8px 10px;font-size:15px;font-weight:700;
}
.glossary-item strong{color:var(--grape);}
.glossary-item .en{color:var(--ink-soft);font-weight:700;}

.badge{
  display:inline-flex;align-items:center;gap:6px;background:var(--grass);color:#fff;
  font-size:15px;font-weight:800;padding:8px 14px;border-radius:999px;margin-top:8px;
  border:3px solid var(--ink);
}

@media(max-width:600px){
  .matchgrid{grid-template-columns:1fr;}
  .card{padding:18px 14px;}
  .buddy{font-size:40px;}
}

.explainer{
  background:#eef6f2;border:2px solid #c9dfd4;padding:14px 16px;border-radius:18px;
  font-size:16px;color:var(--ink);margin-bottom:16px;line-height:1.55;font-weight:700;
}
.explainer strong{color:#4f8f7e;}
.tipbox{
  background:#f7f1e0;border:2px solid #e5d7b4;border-radius:18px;
  padding:14px 16px;margin-bottom:16px;font-size:16px;line-height:1.55;font-weight:700;
}
.tipbox strong{color:#9a4b00;}
.note{font-size:15px;color:var(--ink-soft);margin:0 0 10px;font-weight:700;line-height:1.5;}
.summarybox{background:#fff;border:3px solid var(--ink);border-radius:18px;padding:16px 18px;margin-top:14px;}
.summaryrow{display:flex;justify-content:space-between;padding:8px 0;border-bottom:2px solid #f0ecff;font-size:15px;font-weight:800;}
.summaryrow:last-child{border-bottom:none;}
.weak{color:var(--berry);font-weight:800;}
.strong{color:#007a62;font-weight:800;}

.speedbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end;}
.speedbar .lbl{font-size:12px;font-weight:800;color:var(--ink-soft);}
.speedbar .btn{padding:7px 12px;font-size:13px;}
.recapcard{border-color:#e8c9b8;background:#fbf4ee;}
.speaklist{display:flex;flex-direction:column;gap:10px;}
.speakrow{
  background:#fff;border:3px solid var(--ink);border-radius:18px;padding:12px 14px;
}
.speakrow .line-de{font-family:'Fredoka',sans-serif;font-size:20px;font-weight:700;}
.speakrow .line-en{color:var(--ink-soft);font-size:14px;font-weight:700;margin:4px 0 10px;}
.speakrow .listening{background:var(--berry)!important;color:#fff;}
.micdot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#fff;margin-right:6px;animation:pulse 1s ease-in-out infinite;}

.lsrw-rail{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 16px;}
.lsrw-pill{
  font-size:13px;font-weight:800;padding:7px 12px;border-radius:999px;
  border:2.5px solid var(--ink);box-shadow:2px 2px 0 rgba(43,37,80,0.08);
}
.lsrw-pill.L{background:#8fd6ff;}
.lsrw-pill.S{background:#ffe14a;}
.lsrw-pill.R{background:#7ee8a8;}
.lsrw-pill.W{background:#ffb089;}
.phase{
  margin:22px 0 12px;padding:12px 14px;border-radius:16px;border:3px solid var(--ink);
  font-family:'Fredoka',sans-serif;font-size:18px;font-weight:700;
}

/* ===================== DATA ===================== */

const numberWord = (n)=>{
  const ones=["null","eins","zwei","drei","vier","fünf","sechs","sieben","acht","neun","zehn",
  "elf","zwölf","dreizehn","vierzehn","fünfzehn","sechzehn","siebzehn","achtzehn","neunzehn"];
  const tens={20:"zwanzig",30:"dreißig",40:"vierzig",50:"fünfzig",60:"sechzig",70:"siebzig",80:"achtzig",90:"neunzig"};
  if(n<=19) return ones[n];
  if(n===100) return "hundert";
  const t=Math.floor(n/10)*10, u=n%10;
  if(u===0) return tens[t];
  const unit = u===1?"ein":ones[u];
  return unit+"und"+tens[t];
};

const numberWordBig = (n)=>{
  const onesArr=["null","eins","zwei","drei","vier","fünf","sechs","sieben","acht","neun"];
  if(n<=100) return numberWord(n);
  if(n<1000){
    const h=Math.floor(n/100), rem=n%100;
    let word=(h===1?'':onesArr[h])+'hundert';
    if(rem>0) word+=numberWord(rem);
    return word;
  }
  if(n<10000){
    const th=Math.floor(n/1000), rem=n%1000;
    let word=(th===1?'':onesArr[th])+'tausend';
    if(rem>0) word+=numberWordBig(rem);
    return word;
  }
  return String(n);
};

const Music={ctx:null, master:null, bg:null, sfx:null, playing:false, timer:null, step:0, nextTime:0, speechOn:false, sfxDuckTimer:null, micMute:false};
const G4=392, A4=440, B4=493.88, C5=523.25, D5=587.33, E5=659.25, Fs5=739.99, G5=783.99, A5=880, F5=698.46;
const MOZART=[

function audioCtx(){
  const AC=window.AudioContext||window.webkitAudioContext;
  if(!AC) return null;
  if(!Music.ctx){
    Music.ctx=new AC();
    Music.master=Music.ctx.createGain();
    Music.master.gain.value=0.32;
    Music.master.connect(Music.ctx.destination);
    Music.bg=Music.ctx.createGain();
    Music.bg.gain.value=0.45;
    Music.bg.connect(Music.master);
    Music.sfx=Music.ctx.createGain();
    Music.sfx.gain.value=0.85;
    Music.sfx.connect(Music.ctx.destination);
  }
  if(!Music.sfx && Music.ctx){
    Music.sfx=Music.ctx.createGain();
    Music.sfx.gain.value=0.85;
    Music.sfx.connect(Music.ctx.destination);
  }
  return Music.ctx;
}
async function unlockAudio(){
  const ctx=audioCtx();
  if(!ctx) return null;
  try{ if(ctx.state==='suspended') await ctx.resume(); }catch(e){}
  return ctx;
}
function playAt(freq, when, dur, type, vol, dest){
  const ctx=Music.ctx;
  if(!ctx || !freq) return;
  const v=vol||0.35;
  const destNode=dest||Music.master;
  const o=ctx.createOscillator(), g=ctx.createGain();
  o.type=type||'triangle';
  o.frequency.setValueAtTime(freq, when);
  g.gain.setValueAtTime(0, when);
  g.gain.linearRampToValueAtTime(v, when+0.03);
  g.gain.linearRampToValueAtTime(0, when+dur);
  o.connect(g); g.connect(destNode);
  o.start(when); o.stop(when+dur+0.02);
  const o2=ctx.createOscillator(), g2=ctx.createGain();
  o2.type='sine';
  o2.frequency.setValueAtTime(freq*2, when);
  g2.gain.setValueAtTime(0, when);
  g2.gain.linearRampToValueAtTime(v*0.22, when+0.03);
  g2.gain.linearRampToValueAtTime(0, when+dur);
  o2.connect(g2); g2.connect(destNode);
  o2.start(when); o2.stop(when+dur+0.02);
}
function startBand(){
  return unlockAudio().then((ctx)=>{
    if(!ctx || !state.musicOn) return false;
    if(Music.playing) return true;
    Music.playing=true; Music.step=0;
    document.body.classList.add('music-on');
    const now=ctx.currentTime;
    playAt(G4, now, 0.7, 'triangle', 0.18);
    playAt(B4, now+0.08, 0.7, 'triangle', 0.12);
    playAt(D5, now+0.16, 0.75, 'triangle', 0.14);
    Music.nextTime=now+1.05;
    (function pump(){
      if(!Music.playing || !state.musicOn || !Music.ctx) return;
      const t=Music.ctx.currentTime;
      while(Music.nextTime < t+1.6){
        if(Music.micMute){
          Music.nextTime=t+0.25;
          break;
        }
        const note=MOZART[Music.step%MOZART.length];
        const f=note[0], beats=note[1];
        if(f) playAt(f, Music.nextTime, Math.max(0.18, beats*0.5), 'triangle', 0.18, Music.bg);
        Music.step++;
        Music.nextTime+=beats*0.58;
      }
      Music.timer=setTimeout(pump, 160);
    })();
    return true;
  }).catch(()=>false);
}
function stopBand(){
  Music.playing=false;
  if(Music.timer){ clearTimeout(Music.timer); Music.timer=null; }
  document.body.classList.remove('music-on');
}
function setMusic(on){
  state.musicOn=!!on;
  saveProgress();
  if(state.musicOn) return startBand();
  stopBand();
  return Promise.resolve(false);
}
function labelMusic(big){
  if(state.musicOn) return big ? '🎵 Music is on — tap to stop' : '🎵 Music on';
  return big ? '🎵 Music is off — tap to play' : '🎵 Music off';
}
function syncMusicButtons(){
  document.querySelectorAll('[data-music-btn]').forEach(btn=>{
    const big=btn.getAttribute('data-music-btn')==='big';
    btn.textContent=labelMusic(big);
    btn.className='btn'+(state.musicOn?'':' ghost');
  });
}
function toggleMusic(){
  setMusic(!state.musicOn).then(()=>syncMusicButtons());
}
function ensureMusic(e){
  if(!state.musicOn || Music.playing) return;
  if(e && e.target && e.target.closest && e.target.closest('[data-music-btn]')) return;
  startBand().then(ok=>{ if(ok) syncMusicButtons(); });
}
function applyBgGain(){
  if(!Music.bg || !Music.ctx) return;
  const target = Music.micMute ? 0.001 : (Music.speechOn ? 0.08 : 0.45);
  Music.bg.gain.cancelScheduledValues(Music.ctx.currentTime);
  Music.bg.gain.setTargetAtTime(target, Music.ctx.currentTime, 0.05);
}
function duckBand(){
  applyBgGain();
}
function playNoiseClick(when, dur, vol){
  const ctx=Music.ctx;
  if(!ctx || !Music.sfx) return;
  const n=Math.max(1, Math.floor(ctx.sampleRate*dur));
  const buf=ctx.createBuffer(1, n, ctx.sampleRate);
  const data=buf.getChannelData(0);
  for(let i=0;i<n;i++) data[i]=(Math.random()*2-1)*Math.pow(1-i/n, 2.2);
  const src=ctx.createBufferSource();
  src.buffer=buf;
  const hp=ctx.createBiquadFilter();
  hp.type='highpass';
  hp.frequency.value=1600;
  const g=ctx.createGain();
  g.gain.setValueAtTime(vol, when);
  g.gain.exponentialRampToValueAtTime(0.001, when+dur);
  src.connect(hp); hp.connect(g); g.connect(Music.sfx);
  src.start(when); src.stop(when+dur+0.02);
}
function playSfx(kind){
  if(!state.musicOn || Music.micMute) return;
  unlockAudio().then((ctx)=>{
    if(!ctx || !Music.sfx) return;
    const t=ctx.currentTime;
    const bus=Music.sfx;
    if(Music.playing && !Music.speechOn && Music.bg){
      Music.bg.gain.cancelScheduledValues(ctx.currentTime);
      Music.bg.gain.setTargetAtTime(0.08, ctx.currentTime, 0.05);
      if(Music.sfxDuckTimer) clearTimeout(Music.sfxDuckTimer);
      Music.sfxDuckTimer=setTimeout(()=>{
        Music.sfxDuckTimer=null;
        applyBgGain();
      }, 240);
    }
    if(kind==='ok'){
      playNoiseClick(t, 0.04, 0.45);
      playAt(1047, t, 0.12, 'sine', 0.7, bus);
      playAt(1319, t+0.08, 0.18, 'sine', 0.75, bus);
    } else if(kind==='bad'){
      playNoiseClick(t, 0.05, 0.4);
      playAt(220, t, 0.16, 'square', 0.5, bus);
      playAt(165, t+0.09, 0.2, 'square', 0.38, bus);
    } else if(kind==='tap'){
      playNoiseClick(t, 0.05, 0.7);
      playAt(1568, t, 0.08, 'sine', 0.85, bus);
      playAt(2093, t+0.03, 0.07, 'sine', 0.55, bus);
    } else if(kind==='win'){
      playNoiseClick(t, 0.06, 0.5);
      [1047,1319,1568,2093].forEach((f,i)=>playAt(f, t+i*0.1, 0.22, 'sine', 0.72, bus));
    }
  });
}

function speakNow(text, rate, onend){
  window.speechSynthesis.cancel();
  Music.speechOn=true;
  duckBand(true);
  const u = new SpeechSynthesisUtterance(text);
  u.lang='de-DE';
  u.rate = (rate != null ? rate : state.rate);
  u.pitch=1;
  const de = pickGermanVoice();
  if(de) u.voice = de;
  const done=()=>{ Music.speechOn=false; duckBand(false); if(onend) onend(); };
  u.onend = done;
  u.onerror = done;
  window.speechSynthesis.speak(u);
}

function speak(text, rate, onend){
  try{
    if(!window.speechSynthesis){ return; }
    if(voicesReady && pickGermanVoice()){
      speakNow(text, rate, onend);
    } else {
      refreshVoices();
      if(pickGermanVoice()){ speakNow(text, rate, onend); return; }
      let attempts=0;
      const wait=setInterval(()=>{
        refreshVoices();
        attempts++;
        if(pickGermanVoice() || attempts>10){
          clearInterval(wait);
          speakNow(text, rate, onend);
        }
      },150);
    }
  }catch(e){ console.warn('Speech not supported', e); }
}

let heardThisModule = new Set();
function resetHeard(){ heardThisModule = new Set(); }

function wordKey(w){
  return String(w||'').trim().replace(/[.,!?;:"„""''()]/g,'').toLowerCase();
}

function isFirstGerman(word){
  const k = wordKey(word);
  if(!k) return false;
  if(heardThisModule.has(k)) return false;
  heardThisModule.add(k);
  return true;
}

function markHeard(word){
  const k = wordKey(word);
  if(k) heardThisModule.add(k);
}

function escapeAttr(s){
  return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
}

function firstSpeakHTML(word, speakAs){
  const say = speakAs || String(word).replace(/[.,!?;:]+$/,'');
  if(!isFirstGerman(say)) return '';
  return `<button class="spk first-spk" type="button" data-say="${escapeAttr(say)}" title="Hear ${say}" aria-label="Hear ${say}">🔊</button>`;
}

function deHTML(word, speakAs, meaning){
  const say = speakAs || String(word).replace(/[.,!?;:]+$/,'');
  const first = isFirstGerman(say);
  const btn = first
    ? `<button class="spk first-spk" type="button" data-say="${escapeAttr(say)}" title="Hear ${say}" aria-label="Hear ${say}">🔊</button>`
    : '';
  const g = meaning ? ` <span class="gloss">(= ${meaning})</span>` : '';
  return `<span class="deword"><strong class="de">${word}</strong>${btn}</span>${g}`;
}

function glossHTML(word, en, speakAs){
  return deHTML(word, speakAs, en);
}

function looksGerman(str){
  const t = String(str||'').trim();
  if(!t) return false;
  if(/[ÄÖÜäöüß]/.test(t)) return true;
  const parts = t.split(/[\s/]+/).filter(Boolean);
  if(parts.some(p=>GERMAN_LEXICON.has(wordKey(p)))) return true;
  if(ENGLISH_WORDS.has(wordKey(t))) return false;
  return GERMAN_LEXICON.has(wordKey(t));
}

function decorateQuotedGerman(text){
  return String(text).replace(/"([^"]+)"/g, (m, inner)=>{
    const decorated = inner.replace(/[A-Za-zÄÖÜäöüß]+/g, (w)=>{
      return looksGerman(w) ? deHTML(w) : w;
    });
    return '"' + decorated + '"';
  });
}

function loadProgress(){

    const d=JSON.parse(raw);
    if(Array.isArray(d.done)){
      state.done=new Set(d.done.map(id=>id==='exam'?'challenge':id));
    }
    if(state.done.size && !state.done.has('hallo')) state.done.add('hallo');
    if(d.current){
      const cur=d.current==='exam'?'challenge':d.current;
      if(LEVELS.some(m=>m.id===cur)) state.current=cur;
    }
    if(typeof d.locksOn==='boolean') state.locksOn=d.locksOn;

  }catch(e){}

function levelById(id){ return LEVELS.find(m=>m.id===id); }
function isUnlocked(id){
  if(!state.locksOn) return true;
  const m=levelById(id);
  if(!m) return false;
  if(m.extra) return state.done.has('hallo') || STORY_LEVELS.some(x=>state.done.has(x.id));
  if(m.level===1) return true;
  if(state.done.has(id)) return true;
  const prev=LEVELS.find(x=>x.level===m.level-1);
  if(prev && state.done.has(prev.id)) return true;
  return STORY_LEVELS.some(x=>x.level>m.level && state.done.has(x.id));
}
function nextStoryLevel(id){
  const m=levelById(id);
  if(!m || !m.level) return null;
  return LEVELS.find(x=>x.level===m.level+1) || null;

function goTo(id){
  if(!isUnlocked(id)){
    const m=levelById(id);
    const prev=m && m.level ? LEVELS.find(x=>x.level===m.level-1) : LEVELS.find(x=>x.id==='hallo');
    state.lockHint=prev
      ? `🔒 Level ${m.level} is sleeping. Clear Level ${prev.level} (${prev.en}) first — then Simba will open the gate.`
      : '🔒 Finish Level 1 first. Simba is picky about queues.';
    playSfx('bad');
    render();
    return;
  }
  state.lockHint=null;
  state.current=id;
  saveProgress();
  playSfx('tap');
  render();
  window.scrollTo({top:0,behavior:'smooth'});
}
function markDone(id){
  const wasNew=!state.done.has(id);
  state.done.add(id);
  saveProgress();
  if(wasNew && levelById(id) && levelById(id).level){
    state.justCleared=id;
    playSfx('win');
  }
  render();
}
function resetProgress(){
  state.done=new Set();
  state.current='hallo';
  state.justCleared=null;
  state.lockHint=null;
  state.confirmReset=false;
  saveProgress();
  render();
  window.scrollTo({top:0,behavior:'smooth'});
}

function foldDe(s){
  return String(s||'').toLowerCase()
    .replace(/ß/g,'ss').replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue')
    .replace(/[.,!?;:"„""''¡¿]/g,'').replace(/\s+/g,' ').trim();
}
function squeezeDe(s){
  return foldDe(s)
    .replace(/tsch/g,'ch').replace(/sch/g,'sh').replace(/ch/g,'x')
    .replace(/ck/g,'k').replace(/tz/g,'z').replace(/ph/g,'f')
    .replace(/ae|ai|ay|ei/g,'e').replace(/oe|eu/g,'o').replace(/ue/g,'u').replace(/ie/g,'i')
    .replace(/w/g,'v').replace(/j/g,'y').replace(/c/g,'k')
    .replace(/[^a-z0-9]+/g,'').replace(/(.)\1+/g,'$1');
}
function editDist(a,b){
  const m=a.length, n=b.length;
  if(!m) return n; if(!n) return m;
  const row=new Array(n+1);
  for(let j=0;j<=n;j++) row[j]=j;
  for(let i=1;i<=m;i++){
    let prev=row[0]; row[0]=i;
    for(let j=1;j<=n;j++){
      const tmp=row[j];
      row[j]=a[i-1]===b[j-1] ? prev : 1+Math.min(prev, row[j], row[j-1]);
      prev=tmp;
    }
  }
  return row[n];
}
function closeEnough(a,b){
  if(!a || !b) return false;
  if(a===b || a.includes(b) || b.includes(a)) return true;
  const d=editDist(a,b), max=Math.max(a.length,b.length);
  if(max<=5) return d<=2;
  if(max<=8) return d<=3;
  return d/max<=0.45;
}
const HEAR_STOP=new Set(['der','die','das','den','dem','des','ein','eine','einen','einem','eines','und','in','im','ist','bin','bist','sind','seid','hat','habe','haben','wir','ihr','sie','du','ich','es','the','a','an','is','am','are','my','i']);
function tokensOf(s){
  return foldDe(s).split(' ').filter(w=>w && !HEAR_STOP.has(w) && w.length>1);
}
const HEAR_ALIASES={
  tschuess:['tschuss','tschuess','tschues','tschus','tuss','tus','chus','chuss','choose','chose','juice','chess','cheers','shoes','cheese','ciao','bye','bye bye','tchuss','tues','jus','chos','tchuess','schuss','toes','two shoes','just','tchus','zus','shoes','choos','chews','jews','tues'],
  hallo:['hello','halo','hallow','hola','alo','hollow','hallo','allo','hullo'],
  danke:['danke','danka','thanks','thank you','thankyou','donkey','dunkay','danka schon']
};
function aliasKey(expected){
  const f=foldDe(expected).replace(/^(der|die|das)\s+/,'');
  if(HEAR_ALIASES[f]) return f;
  if(f.indexOf('tschue')===0 || f.indexOf('tschus')===0) return 'tschuess';
  if(f==='hallo' || f==='hello') return 'hallo';
  if(f.indexOf('dank')===0) return 'danke';
  return '';
}
function heardMatches(heard, expected, expectedEn){
  const h=foldDe(heard), e=foldDe(expected);
  if(!h || !e) return false;
  if(closeEnough(h,e) || closeEnough(squeezeDe(h), squeezeDe(e))) return true;
  const key=aliasKey(expected);
  if(key){
    const pool=HEAR_ALIASES[key]||[];
    const hs=squeezeDe(h);
    if(pool.some(a=>{
      const fa=foldDe(a), sa=squeezeDe(a);
      return h===fa || hs===sa || h.includes(fa) || fa.includes(h) || closeEnough(hs,sa) || closeEnough(h,fa);
    })) return true;
  }
  const ht=tokensOf(h), et=tokensOf(e);
  if(et.length){
    const hit=et.filter(t=>ht.some(x=>closeEnough(squeezeDe(x), squeezeDe(t)))).length;
    if(hit/et.length>=0.45) return true;
  }
  if(expectedEn){
    const en=foldDe(expectedEn), ens=squeezeDe(en), hs=squeezeDe(h);
    if(closeEnough(h,en) || closeEnough(hs,ens)) return true;
    const ent=tokensOf(en);
    if(ent.length){
      const hit=ent.filter(t=>ht.some(x=>closeEnough(squeezeDe(x), squeezeDe(t)))).length;
      if(hit/ent.length>=0.5) return true;
    }
  }
  return false;
}
function canListen(){
  return !!(window.isSecureContext && (window.SpeechRecognition || window.webkitSpeechRecognition));
}
const Listen={rec:null, timer:null, active:false, btn:null};
function stopListen(){
  Listen.active=false;
  if(Listen.timer){ clearTimeout(Listen.timer); Listen.timer=null; }
  if(Listen.btn){ Listen.btn.classList.remove('listening'); Listen.btn=null; }
  if(Listen.rec){
    const r=Listen.rec; Listen.rec=null;
    r.onresult=r.onerror=r.onend=null;
    try{ r.abort(); }catch(e){}
  }
  Music.micMute=false;
  applyBgGain();
}
function startListen(expected, expectedEn, btn, fb){
  const Rec=window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!Rec || !window.isSecureContext){
    fb.textContent='The microphone needs the website (or tap “I said it” — that still counts).';
    fb.className='qfeedback try';
    return;
  }
  stopListen();
  try{ window.speechSynthesis.cancel(); }catch(e){}
  Music.speechOn=false;
  Music.micMute=true;
  applyBgGain();

  Listen.active=true;
  Listen.btn=btn;
  btn.classList.add('listening');
  const cue=String(expected||'').replace(/[!.?]+$/g,'').trim();
  fb.textContent='Listening… say “'+cue+'” now!';
  fb.className='qfeedback';

  const alts=[];
  let won=false;
  let restarts=0;
  const langs=['de-DE','de-DE','en-IN','en-GB'];
  const shortLine=foldDe(expected).split(' ').filter(Boolean).length<=2;
  const finish=()=>{
    if(!Listen.active) return;
    const rec=Listen.rec;
    Listen.active=false;
    if(Listen.timer){ clearTimeout(Listen.timer); Listen.timer=null; }
    if(rec){
      rec.onresult=rec.onerror=rec.onend=null;
      try{ rec.stop(); }catch(e){}
      Listen.rec=null;
    }
    btn.classList.remove('listening');
    Listen.btn=null;
    Music.micMute=false;
    applyBgGain();
    if(won) return;
    if(alts.length){
      fb.textContent='I heard “'+alts[0]+'”. Brave try! Tap the mic again, or “I said it” — that still counts.';
      fb.className='qfeedback try';
    } else {
      fb.textContent='I didn’t catch it. Speak a little louder after you tap, or tap “I said it”. That still counts!';
      fb.className='qfeedback try';
    }
  };
  const succeed=(heard)=>{
    if(won) return;
    won=true;
    const looksLike=foldDe(heard).indexOf(foldDe(cue))>=0;
    fb.textContent= looksLike ? 'Yes! I heard you: “'+heard+'”. ✓' : 'Yes! That sounded like '+cue+'. ✓';
    fb.className='qfeedback ok';
    finish();
    playSfx('ok');
  };
  const bootRec=(lang)=>{
    if(!Listen.active || won) return;
    const r=new Rec();
    Listen.rec=r;
    r.lang=lang||'de-DE';
    r.interimResults=true;
    r.continuous=!shortLine;
    r.maxAlternatives=8;
    r.onresult=(ev)=>{
      if(!Listen.active || won) return;
      for(let i=ev.resultIndex;i<ev.results.length;i++){
        for(let j=0;j<ev.results[i].length;j++){
          const t=ev.results[i][j].transcript;
          if(t && alts.indexOf(t)<0) alts.push(t);
        }
        const live=ev.results[i][0] && ev.results[i][0].transcript;
        if(live) { fb.textContent='Hearing: “'+live+'” …'; fb.className='qfeedback'; }
      }
      const hit=alts.find(a=>heardMatches(a, expected, expectedEn));
      if(hit) succeed(hit);
    };
    r.onerror=(ev)=>{
      if(!Listen.active || won) return;
      const err=ev && ev.error;
      if(err==='no-speech' || err==='aborted') return;
      if(err==='not-allowed' || err==='service-not-allowed'){
        fb.textContent='Allow the microphone, or tap “I said it”. Speaking out loud still counts.';
        fb.className='qfeedback try';
        won=true;
        finish();
        return;
      }
      if(err==='audio-capture'){
        fb.textContent='No microphone found. Tap “I said it” after you say the line.';
        fb.className='qfeedback try';
        won=true;
        finish();
      }
    };
    r.onend=()=>{
      if(!Listen.active || won) return;
      const hit=alts.find(a=>heardMatches(a, expected, expectedEn));
      if(hit){ succeed(hit); return; }
      if(restarts<3){
        restarts++;
        bootRec(langs[Math.min(restarts, langs.length-1)]);
        return;
      }
      finish();
    };
    try{ r.start(); }
    catch(e){
      fb.textContent='Allow the microphone, or tap “I said it” after you speak.';
      fb.className='qfeedback try';
      finish();
    }
  };
  Listen.timer=setTimeout(finish, 12000);
  setTimeout(()=>{
    if(!Listen.active || won) return;
    bootRec('de-DE');
  }, 400);
}

function ottoSays(card, text){

}

function lsrwRail(card){
  const d=document.createElement('div'); d.className='lsrw-rail';
  d.innerHTML=`
    <span class="lsrw-pill L">1 👂 Listen</span>
    <span class="lsrw-pill S">2 🗣️ Speak</span>
    <span class="lsrw-pill R">3 📖 Read</span>
    <span class="lsrw-pill W">4 ✍️ Write</span>`;
  card.appendChild(d);
}

function phase(card, skill, title, blurb){
  const p=document.createElement('div');
  p.className='phase '+skill;
  p.innerHTML=`<div>${title}</div>${blurb?`<div class="phase-blurb">${blurb}</div>`:''}`;
  card.appendChild(p);
}

function renderListenAll(card, words){
  const row=document.createElement('div'); row.className='btnrow';
  const b=document.createElement('button'); b.className='btn'; b.textContent='🔊 Play all — just listen (no peeking, honour system)';
  b.onclick=()=>{
    let i=0;
    const step=()=>{
      if(i>=words.length) return;
      speak(words[i], Math.min(state.rate, 0.7), ()=>setTimeout(()=>{ i++; step(); }, 260));
    };
    step();
  };
  row.appendChild(b);
  const tip=document.createElement('p'); tip.className='note';
  tip.textContent='Close your eyes if you like. Hear the music of the words before you look at letters. (Peeking is for later. Simba is watching. Kindly.)';
  card.appendChild(tip);
  card.appendChild(row);
}

function renderWriteFromEnglish(card, items){
  if(!items || !items.length) return;
  sectionLabel(card,'Write the German');
  const note=document.createElement('p'); note.className='note';
  note.textContent='Type the German. Spelling counts — umlauts (ä ö ü) and ß matter. They are not decoration; they are the word in a hat. Tap the speaker only after you have tried.';
  card.appendChild(note);
  const wrap=document.createElement('div');
  items.forEach((it)=>{
    const row=document.createElement('div'); row.className='fillrow';
    const lab=document.createElement('span'); lab.textContent=it.en+' →';
    row.appendChild(lab);
    const input=document.createElement('input');
    input.placeholder='German'; input.autocomplete='off';
    input.style.width='min(100%, 280px)';
    input.oninput=()=>{
      const val=foldDe(input.value);
      const want=foldDe(it.answer);
      if(!input.value.trim()){ input.classList.remove('ok','bad'); return; }
      if(val===want){ input.classList.add('ok'); input.classList.remove('bad'); }
      else { input.classList.remove('ok'); input.classList.add('bad'); }
    };
    row.appendChild(input);
    row.appendChild(speakerBtn(it.answer));
    wrap.appendChild(row);
  });
  card.appendChild(wrap);
}

  const card=document.createElement('div'); card.className='card';
  const m=levelById(state.current);

    : (m && m.extra ? `<div class="levelchip extra">${m.en}</div>` : '');
  card.innerHTML=`${chip}<h2>${title}</h2><div class="tagline">${tagline}</div>`;
  return card;
}

}

function sectionLabel(card, text){

}

  explainer(card, `<strong>LSRW:</strong> Listen first, then Speak, then Read, then Write. That order helps German stay in your ears and your mouth — not only on the page.<br><br><strong>What's a “verb”?</strong> A verb is an action or state word — like “am”, “have”, “run”. In German (and English), the verb changes its spelling depending on <em>who</em> is doing it — this is called <strong>conjugation</strong>. Compare: “I am” vs “she is” in English — same idea, just different endings.`);
  ottoSays(card, 'If you can say <em>I am</em> and <em>I have</em>, you can introduce yourself <em>and</em> brag about your snacks. Priorities.');

  const usage=document.createElement('div'); usage.className='tipbox';
  usage.innerHTML=`<strong>So when do I use which one?</strong><br><br>
  ${deHTML('sein')} (to be) — use it to say who or what someone/something <em>is</em>: their name, age, or a description.<br>
  ${deHTML('haben')} (to have) — use it to say what someone <em>owns or has</em>: possessions, family members, pets.<br><br>
  Quick check: if the sentence is describing <strong>what something IS</strong>, use ${deHTML('sein')}. If it's describing <strong>what someone OWNS</strong>, use ${deHTML('haben')}.`;

  phase(card,'L','1 👂 Listen','Hear the German. Choose the English meaning. No writing yet. (Simba’s ears are enormous. Use yours.)');

  ];
  t1.innerHTML=`<tr><th>${glossHTML('Pronomen','pronouns')}</th><th>${glossHTML('Sein','to be')}</th><th>English</th><th></th></tr>`+

  sectionLabel(card,'Haben — to have');
  const habenNote=document.createElement('p'); habenNote.className='note';
  habenNote.innerHTML=`Same idea here: <strong>${deHTML('habe')} (= have), ${deHTML('hast')} (= have), ${deHTML('hat')} (= has), ${deHTML('haben')} (= have), ${deHTML('habt')} (= have) are all forms of the verb ${deHTML('haben')}</strong> — the dictionary form is ${deHTML('haben')}, and each pronoun (${glossHTML('ich','I')}, ${glossHTML('du','you')}, ${glossHTML('er','he')}...) gets its own matching form, just like “bin/bist/ist” did for ${deHTML('sein')} above.`;
  card.appendChild(habenNote);
  const t2=document.createElement('table'); t2.className='conj';
  const habenRows=[
    ['ich','habe','I have'],['du','hast','you have'],['er/sie/es','hat','he/she/it has'],

  ]);

  phase(card,'R','3 📖 Read','Read it as a passage. Meanings are not inside the story — they live in Word help below.');
  const now=document.createElement('div'); now.id='story-now';
  card.appendChild(now);
  sectionLabel(card, story.title);
  const p=document.createElement('div'); p.className='passage';
  story.text.split(/\n\s*\n/).forEach((chunk)=>{
    const para=document.createElement('p'); para.textContent=chunk.trim();
    p.appendChild(para);
  });
  card.appendChild(p);
  const hearRow=document.createElement('div'); hearRow.className='btnrow';
  const hearAll=document.createElement('button'); hearAll.className='btn ghost'; hearAll.textContent='🔊 Hear the whole story';
  hearAll.onclick=speakStory;
  hearRow.appendChild(hearAll);
  card.appendChild(hearRow);

  const panel=document.createElement('div'); panel.className='glossary-panel';
  panel.innerHTML=`<h3>Word help</h3><p class="hint">For this story only. Read the passage first. Peek here if a word is stuck.</p>`;
  const g=document.createElement('div'); g.className='glossary-grid';
  story.glossary.forEach(([w,m])=>{
    const item=document.createElement('div'); item.className='glossary-item';
    const strong=document.createElement('strong'); strong.textContent=w;
    const en=document.createElement('span'); en.className='en'; en.textContent=' — '+m;
    item.appendChild(strong); item.appendChild(en);
    item.appendChild(speakerBtn(w));
    g.appendChild(item);
  });
  panel.appendChild(g);
  card.appendChild(panel);

  phase(card,'W','4 ✍️ Write','These questions are about the story you just read.');
  sectionLabel(card,'Comprehension questions');
  renderQuiz(card, story.questions, (score,total)=>{ if(score>=total-1) markDone('lesen'); });

  root.appendChild(card);
}

function renderChallenge(root){
  const card=moduleShell('Simba-Cup','Boss level! A mix of everything you have learned so far. No timer. No scary test. Just show Simba you remember.');
  const startWrap=document.createElement('div');
  const info=document.createElement('p'); info.className='note';
  info.textContent='This is a fun mix from every level. Take your time. If a bit feels wobbly, go back to that level in the Practice park afterwards.';
  startWrap.appendChild(info);
  const startBtn=document.createElement('button'); startBtn.className='btn'; startBtn.textContent='Start the Simba-Cup 🏆';
  startWrap.appendChild(startBtn);
  card.appendChild(startWrap);
  root.appendChild(card);

  startBtn.onclick=()=>{
    startWrap.remove();
    runChallenge(card);
  };
}

function runChallenge(card){
  const examQs=[
    {topic:'Hallo', q:'"Hallo" means...', opts:['Bye','Hello','Please'], a:1, audio:'Hallo'},
    {topic:'Hallo', q:'How do you say "bye"?', opts:['Bitte','Hallo','Tschüss'], a:2, audio:'Tschüss'},
    {topic:'Haben & Sein', q:'"Ich ___ zehn Jahre alt."', opts:['bin','habe','bist'], a:0},
    {topic:'Haben & Sein', q:'"Wir ___ einen Hund."', opts:['sind','haben','seid'], a:1},
    {topic:'This is me', q:'How do you say "My name is Anna"?', opts:['Ich bin Anna.','Ich heiße Anna.','Ich habe Anna.'], a:1, audio:'Ich heiße Anna'},
    {topic:'This is me', q:'"Ich bin in der sechsten Klasse" means...', opts:['I am six.','I am in class 6.','I have six hobbies.'], a:1, audio:'Ich bin in der sechsten Klasse'},
    {topic:'Farben', q:'"Blau" means...', opts:['Green','Blue','Yellow'], a:1, audio:'Blau'},
    {topic:'Farben', q:'How do you say "black"?', opts:['Schwarz','Weiß','Grau'], a:0},
    {topic:'Adjektive', q:'Opposite of "groß"?', opts:['Klein','Alt','Schnell'], a:0, audio:'groß'},
    {topic:'Adjektive', q:'"Kalt" means...', opts:['Hot','Cold','Fast'], a:1, audio:'Kalt'},
    {topic:'Zahlen', q:'What is "einundzwanzig"?', opts:['12','21','30'], a:1, audio:'einundzwanzig'},
    {topic:'Zahlen', q:'How do you say 60?', opts:['sechzig','sechzehn','sechs'], a:0},
    {topic:'Familie', q:'"Der Bruder" means...', opts:['The sister','The brother','The father'], a:1, audio:'Der Bruder'},
    {topic:'Familie', q:'"Die Großmutter" means...', opts:['The grandmother','The aunt','The mother'], a:0, audio:'Die Großmutter'},
    {topic:'Pronomen', q:'Polite "you" is...', opts:['du','Sie','ihr'], a:1},
    {topic:'Pronomen', q:'"Wir" means...', opts:['You (group)','We','They'], a:1, audio:'Wir'},
    {topic:'Verben', q:'"Du ___ aus Italien." (kommen)', opts:['kommst','kommt','komme'], a:0},
    {topic:'Verben', q:'"Er ___ in Berlin." (wohnen)', opts:['wohnt','wohnst','wohnen'], a:0},
    {topic:'Lesetext', q:'In “Anna in Berlin”, Anna is from...', opts:['Munich','Berlin','Hamburg'], a:1},
    {topic:'Lesetext', q:'In “Simba and the cake”, Simba says he is a...', opts:['Lion','Cake','Dog'], a:2},
  ];
  const topicScores={};
  const quizHost=document.createElement('div');
  card.appendChild(quizHost);
  let idx=0, score=0;
  examQs.forEach(e=>{ if(!(e.topic in topicScores)) topicScores[e.topic]={correct:0,total:0}; });
  function showQ(){
    quizHost.innerHTML='';
    if(idx>=examQs.length){ finishChallenge(); return; }
    const item=examQs[idx];
    const box=document.createElement('div'); box.className='qwrap';
    const prog=document.createElement('div'); prog.className='progressline'; prog.textContent=`Simba-Cup ${idx+1} / ${examQs.length} — ${item.topic}`;
    box.appendChild(prog);
    const p=document.createElement('div'); p.className='qprompt';
    p.innerHTML = decorateQuotedGerman(item.q);
    if(item.audio) p.appendChild(speakerBtn(item.audio));
    else {
      const quoted = String(item.q).match(/"([^"]+)"/);
      if(quoted) p.appendChild(speakerBtn(quoted[1].replace(/_/g,' ').trim()));
    }
    box.appendChild(p);
    item.opts.forEach((opt,i)=>{
      const b=document.createElement('button'); b.className='qopt';
      const label=document.createElement('span'); label.textContent=opt; b.appendChild(label);
      if(looksGerman(opt)) b.appendChild(speakerBtn(opt));
      b.onclick=()=>{
        [...box.querySelectorAll('.qopt')].forEach(x=>x.disabled=true);
        topicScores[item.topic].total++;
        if(i===item.a){ b.classList.add('correct'); score++; topicScores[item.topic].correct++; }
        else{ b.classList.add('incorrect'); [...box.querySelectorAll('.qopt')][item.a].classList.add('correct'); }
        setTimeout(()=>{ idx++; showQ(); },700);
      };
      box.appendChild(b);
    });
    quizHost.appendChild(box);
  }
  showQ();

  function finishChallenge(){
    quizHost.innerHTML='';
    const summary=document.createElement('div'); summary.className='summarybox';
    let html=`<div style="font-family:'Fredoka',sans-serif;font-size:22px;margin-bottom:8px;">Simba-Cup score: ${score} / ${examQs.length}</div>`;
    Object.entries(topicScores).forEach(([topic,{correct,total}])=>{
      if(total===0) return;
      const pct=Math.round(100*correct/total);
      const cls = pct>=75?'strong':(pct<50?'weak':'');
      html+=`<div class="summaryrow"><span>${topic}</span><span class="${cls}">${correct}/${total}</span></div>`;
    });
    summary.innerHTML=html;
    card.appendChild(summary);
    const weakTopics=Object.entries(topicScores).filter(([t,{correct,total}])=>total>0 && correct/total<0.5).map(([t])=>t);
    if(weakTopics.length){
      const w=document.createElement('p'); w.className='note'; w.style.marginTop='12px';
      w.innerHTML=`<strong>Play these again in Practice park:</strong> ${weakTopics.join(', ')} — Simba’s gentle hint list.`;
      card.appendChild(w);
    } else {
      const w=document.createElement('p'); w.className='note'; w.style.marginTop='12px';
      w.textContent='Wow. Simba would give you a medal, but he already spent it on snacks.';
      card.appendChild(w);
    }
    if(score>=examQs.length-2){
      const claim=document.createElement('button'); claim.className='btn'; claim.style.marginTop='14px';
      claim.textContent='Claim Level '+STORY_LEVELS.length+' star ⭐';
      claim.onclick=()=>markDone('challenge');
      card.appendChild(claim);
    } else {
      const again=document.createElement('p'); again.className='note'; again.style.marginTop='12px';
      again.textContent='Almost! Play the wobbly topics again, then come back for the Simba-Cup.';
      card.appendChild(again);
    }
  }
}

function renderRevision(root){
  const card=moduleShell('Practice park — Flashcards','A playground, not a test. Hear, say, read, then check. Say the German out loud before you flip. Whispering still counts. Dramatic whispering counts extra.');
  const allCards=[
    ...GREETINGS.map(([de,en])=>({front:de,back:en,type:'Hallo'})),
    ...INTRO_NAME.concat(INTRO_CLASS,INTRO_RELIGION,INTRO_HOBBIES).map(([de,en])=>({front:de,back:en,type:'Ich bin…'})),
    ...COLORS.map(([de,en])=>({front:de,back:en,type:'Farben'})),
    ...ADJ_PAIRS.flatMap(([a,ae,b,be])=>[{front:a,back:ae,type:'Adjektive'},{front:b,back:be,type:'Adjektive'}]),
    ...FAMILY.map(([de,en])=>({front:de,back:en,type:'Familie'})),
    ...PRONOUNS.map(([de,en])=>({front:de,back:en,type:'Pronomen'})),
    ...[5,12,17,21,34,45,60,73,88,99].map(n=>({front:String(n),back:numberWord(n),type:'Zahlen'})),
  ].sort(()=>Math.random()-0.5);

  let i=0, flipped=false;
  const cardEl=document.createElement('div'); cardEl.className='flashcard';
  const spkHost=document.createElement('div');
  function germanOf(c){ return c.type==='Zahlen' ? c.back : c.front; }
  const TYPE_EN={Hallo:'Hello', 'Ich bin…':'This is me', Farben:'Colours', Adjektive:'Adjectives', Familie:'Family', Pronomen:'Pronouns', Zahlen:'Numbers'};
  function draw(){
    flipped=false;
    const c=allCards[i];
    const typeLabel = TYPE_EN[c.type] ? `${c.type} (= ${TYPE_EN[c.type]})` : c.type;
    cardEl.innerHTML=`<div>${c.front}</div><div class="hint">${typeLabel} · say it like you mean it, then tap</div>`;
    spkHost.innerHTML='';
    const first = firstSpeakerBtn(germanOf(c));
    spkHost.appendChild(first || speakerBtn(germanOf(c)));
    counter.textContent=`${i+1} / ${allCards.length}`;
  }
  cardEl.onclick=()=>{
    const c=allCards[i];
    flipped=!flipped;
    if(flipped){ cardEl.innerHTML=`<div>${c.back}</div><div class="hint">tap to flip back</div>`; speak(germanOf(c)); }
    else draw();
  };
  const nav=document.createElement('div'); nav.className='flashnav';
  const prevBtn=document.createElement('button'); prevBtn.className='btn ghost'; prevBtn.textContent='← Back';
  prevBtn.onclick=()=>{ i=(i-1+allCards.length)%allCards.length; draw(); };
  const counter=document.createElement('span');
  const nextBtn=document.createElement('button'); nextBtn.className='btn ghost'; nextBtn.textContent='Next →';
  nextBtn.onclick=()=>{ i=(i+1)%allCards.length; draw(); };
  nav.appendChild(prevBtn); nav.appendChild(counter); nav.appendChild(nextBtn);

  card.appendChild(cardEl);
  const listenRow=document.createElement('div'); listenRow.style.cssText='display:flex;justify-content:center;margin-bottom:12px;';
  listenRow.appendChild(spkHost);
  card.appendChild(listenRow);
  card.appendChild(nav);
  draw();

  root.appendChild(card);
}

/* ===================== RENDER SHELL ===================== */
const RENDERERS={
  'hallo':renderHallo,'haben-sein':renderHabenSein,'vorstellen':renderVorstellen,'farben':renderFarben,'adjektive':renderAdjektive,
  'zahlen':renderZahlen,'zahlen100':renderZahlen100,'familie':renderFamilie,'pronomen':renderPronomen,
  'verben':renderVerben,'lesen':renderLesen,'stories':renderLesen,'challenge':renderChallenge,'revision':renderRevision
};

function render(){
  stopListen();
  const app=document.getElementById('app');
  app.innerHTML='';
  resetHeard();
  if(!isUnlocked(state.current) || !RENDERERS[state.current]){
    const playable=[...STORY_LEVELS].reverse().find(m=>RENDERERS[m.id] && isUnlocked(m.id));
    state.current=playable?playable.id:'hallo';
    saveProgress();
  }

  const masthead=document.createElement('div'); masthead.className='masthead';
  const left=document.createElement('div');
  left.innerHTML=`
      <div class="rainbowbar" title="Rainbow path"></div>
      <h1>🦄 Deutsch<span>reise</span></h1>
      <div class="sub">${glossHTML('Deutschreise','German journey')} · Jungle friends · Music on — tap 🎵 to stop</div>
  `;
  left.querySelector('h1').appendChild(speakerBtn('Deutschreise'));
  const tools=document.createElement('div');
  tools.style.cssText='display:flex;flex-direction:column;align-items:flex-end;gap:10px;';
  const speed=document.createElement('div'); speed.className='speedbar';
  const lbl=document.createElement('span'); lbl.className='lbl'; lbl.textContent='Speaking speed';
  const slowBtn=document.createElement('button'); slowBtn.className='btn ghost'; slowBtn.type='button'; slowBtn.textContent='🐢 Slow';
  const normBtn=document.createElement('button'); normBtn.className='btn'; normBtn.type='button'; normBtn.textContent='🚶 Normal';
  function syncSpeed(){
    const slow=state.rate<0.75;
    slowBtn.className='btn'+(slow?'':' ghost');
    normBtn.className='btn'+(slow?' ghost':'');
  }
  slowBtn.onclick=()=>{ state.rate=0.58; syncSpeed(); saveProgress(); };
  normBtn.onclick=()=>{ state.rate=0.85; syncSpeed(); saveProgress(); };
  syncSpeed();
  const musicBtn=document.createElement('button');
  musicBtn.type='button';
  musicBtn.setAttribute('data-music-btn','bar');
  musicBtn.className='btn'+(state.musicOn?'':' ghost');
  musicBtn.textContent=labelMusic(false);
  musicBtn.title='Music plays by default. Tap to switch it off or on.';
  musicBtn.onclick=toggleMusic;
  speed.appendChild(lbl); speed.appendChild(slowBtn); speed.appendChild(normBtn); speed.appendChild(musicBtn);
  const buddies=document.createElement('div'); buddies.className='buddies';
  const raksha=document.createElement('div'); raksha.className='buddy unicorn'; raksha.textContent='🦄';
  raksha.title='Tap Raksha the unicorn — she lives in the jungle and speaks easy German.';
  raksha.onclick=()=>speak(pickOne(RAKSHA_CHAT));
  const buddy=document.createElement('div'); buddy.className='buddy'; buddy.textContent='🦁';
  buddy.title='Tap Simba — he only speaks German, and he knows about five sentences.';
  buddy.onclick=()=>speak(pickOne(OTTO_CHAT));
  buddies.appendChild(raksha); buddies.appendChild(buddy);
  tools.appendChild(speed); tools.appendChild(buddies);
  masthead.appendChild(left); masthead.appendChild(tools);
  app.appendChild(masthead);

  const welcome=document.createElement('div'); welcome.className='welcomebox';
  const mapDone=STORY_LEVELS.every(m=>state.done.has(m.id));
  welcome.innerHTML= mapDone
    ? `<strong>Rainbow map complete!</strong> You cleared all ${STORY_LEVELS.length} levels. Replay any level, hang out in the Story shelf, or tap <strong>Start again</strong> to reset the rainbow and clear the whole map from Level 1. Use <strong>Free play</strong> if you want every level open, or <strong>Locked path</strong> to open them in order. New levels will arrive as you grow.<br><br><strong>Simba the lion</strong> and <strong>Raksha the unicorn</strong> are your travel buddies. Tap them. Tiny German. Enormous sparkle.`
    : `<strong>A jungle German adventure.</strong> Music plays softly in the background — tap <strong>🎵 Music on</strong> if you want it quiet. Choose <strong>Locked path</strong> to finish one level 🦄 before the next opens, or <strong>Free play</strong> to jump anywhere. Each level uses LSRW: <strong>Listen</strong> → <strong>Speak</strong> → <strong>Read</strong> → <strong>Write</strong>. A glowing 🔊 is a new German word.<br><br><strong>Simba the lion</strong> and <strong>Raksha the unicorn</strong> walk the jungle with you. Tap them for a little German magic.`;
  app.appendChild(welcome);
  const musicRow=document.createElement('div'); musicRow.className='btnrow'; musicRow.style.margin='0 0 16px';
  const bigMusic=document.createElement('button');
  bigMusic.type='button';
  bigMusic.setAttribute('data-music-btn','big');
  bigMusic.className='btn'+(state.musicOn?'':' ghost');
  bigMusic.textContent=labelMusic(true);
  bigMusic.onclick=toggleMusic;
  musicRow.appendChild(bigMusic);
  app.appendChild(musicRow);

  const overall=document.createElement('div');
  const cleared=STORY_LEVELS.filter(m=>state.done.has(m.id)).length;
  const pct=Math.round(100*cleared/STORY_LEVELS.length);
  const toolsRow=document.createElement('div'); toolsRow.className='progress-tools';
  const cap=document.createElement('div'); cap.className='progress-caption';
  cap.textContent= mapDone ? '🌈 Rainbow map cleared!' : `🦄 Level ${Math.min(cleared+1, STORY_LEVELS.length)} of ${STORY_LEVELS.length} · ${cleared} cleared`;
  const resetBtn=document.createElement('button'); resetBtn.className='btn ghost'; resetBtn.type='button';
  resetBtn.textContent='🔁 Start again';
  resetBtn.title='Clear all stars and begin at Level 1';
  resetBtn.onclick=()=>{ state.confirmReset=true; render(); };
  toolsRow.appendChild(cap); toolsRow.appendChild(resetBtn);
  overall.innerHTML=`<div class="overallbar"><div style="width:${pct}%"></div></div>`;
  overall.appendChild(toolsRow);

  const modeRow=document.createElement('div'); modeRow.className='progress-tools'; modeRow.style.marginBottom='10px';
  const modeLbl=document.createElement('div'); modeLbl.className='progress-caption';
  modeLbl.textContent= state.locksOn ? 'Path: locked — finish a level to open the next' : 'Path: free play — every level is open';
  const modeBtns=document.createElement('div'); modeBtns.style.cssText='display:flex;gap:8px;flex-wrap:wrap;';
  const lockBtn=document.createElement('button'); lockBtn.type='button';
  lockBtn.className='btn'+(state.locksOn?'':' ghost');
  lockBtn.textContent='🔒 Locked path';
  lockBtn.title='Open levels in order';
  lockBtn.onclick=()=>{ state.locksOn=true; state.lockHint=null; saveProgress(); render(); };
  const freeBtn=document.createElement('button'); freeBtn.type='button';
  freeBtn.className='btn'+(!state.locksOn?'':' ghost');
  freeBtn.textContent='🔓 Free play';
  freeBtn.title='Open every level now';
  freeBtn.onclick=()=>{ state.locksOn=false; state.lockHint=null; saveProgress(); render(); };
  modeBtns.appendChild(lockBtn); modeBtns.appendChild(freeBtn);
  modeRow.appendChild(modeLbl); modeRow.appendChild(modeBtns);
  overall.appendChild(modeRow);
  app.appendChild(overall);

  if(state.lockHint){
    const hint=document.createElement('div'); hint.className='lockhint'; hint.textContent=state.lockHint;
    app.appendChild(hint);
  }

  const journey=document.createElement('div'); journey.className='journey';
  LEVELS.forEach(m=>{
    const unlocked=isUnlocked(m.id);
    const s=document.createElement('div');
    s.className='stamp'+(m.id===state.current?' active':'')+(state.done.has(m.id)?' done':'')+(!unlocked?' locked':'')+(m.extra?' extra':'');
    const lv = m.level ? `<div class="lv">Lv ${m.level}</div>` : `<div class="lv">Play</div>`;
    s.innerHTML=`${lv}<div class="icon">${unlocked?m.icon:'🔒'}</div><div>${m.label}</div><div class="stampen">${m.en}</div>`;
    s.onclick=()=>goTo(m.id);
    journey.appendChild(s);
  });
  app.appendChild(journey);

  const moduleRoot=document.createElement('div');
  RENDERERS[state.current](moduleRoot);
  app.appendChild(moduleRoot);

  const cur=levelById(state.current);
  if(state.done.has(state.current) && cur && cur.level){
    const b=document.createElement('div'); b.className='badge';
    b.innerHTML= cur.level===STORY_LEVELS.length
      ? '🦄 Boss level cleared! Simba is proud. Raksha is sparkly. (Quietly. Mostly.)'
      : `🦄 Level ${cur.level} cleared! Simba is proud. Raksha did a tiny rainbow.`;
    moduleRoot.appendChild(b);
  }

  const idx=LEVELS.findIndex(m=>m.id===state.current);
  const nav=document.createElement('div'); nav.className='btnrow';
  if(idx>0 && isUnlocked(LEVELS[idx-1].id)){
    const pb=document.createElement('button'); pb.className='btn ghost';
    const prev=LEVELS[idx-1];
    pb.textContent='← '+(prev.level?('Level '+prev.level+' · '):'')+prev.label;
    pb.onclick=()=>goTo(prev.id); nav.appendChild(pb);
  }
  const nxt=LEVELS[idx+1];
  if(nxt){
    if(isUnlocked(nxt.id)){
      const nb=document.createElement('button'); nb.className='btn';
      nb.textContent=(nxt.level?(state.locksOn?('Level '+nxt.level+' unlocked · '):('Level '+nxt.level+' · ')):'')+nxt.label+' →';
      nb.onclick=()=>goTo(nxt.id); nav.appendChild(nb);
    } else if(cur && cur.level && !state.done.has(cur.id)){
      const wait=document.createElement('span'); wait.className='note'; wait.style.margin='8px 0 0';
      wait.textContent='Finish this level check ⭐ to unlock Level '+(cur.level+1)+'.';
      nav.appendChild(wait);
    }
  }
  app.appendChild(nav);

  if(state.justCleared){
    const clearedLv=levelById(state.justCleared);
    const nxtLv=nextStoryLevel(state.justCleared);
    const overlay=document.createElement('div'); overlay.className='level-up';
    const box=document.createElement('div'); box.className='level-up-card';
    const finishedAll=clearedLv && clearedLv.level===STORY_LEVELS.length;
    box.innerHTML=`<div class="burst">${finishedAll?'🌈🦄':'🦄'}</div>
      <h3>${finishedAll?'Rainbow map complete!':'Level '+clearedLv.level+' cleared!'}</h3>
      <p>${finishedAll
        ? 'You finished every beginner level. More levels will appear as you grow. Raksha packed extra sparkles. Simba packed pride.'
        : (clearedLv.label+' is yours. '+clearedLv.en+'. The next rainbow gate just opened.')}</p>`;
    const row=document.createElement('div'); row.className='btnrow'; row.style.justifyContent='center';
    const stay=document.createElement('button'); stay.className='btn ghost'; stay.textContent='Stay here';
    stay.onclick=()=>{ state.justCleared=null; overlay.remove(); };
    row.appendChild(stay);
    if(nxtLv){
      const go=document.createElement('button'); go.className='btn';
      go.textContent='Next: Level '+nxtLv.level+' · '+nxtLv.label+' →';
      go.onclick=()=>{ state.justCleared=null; goTo(nxtLv.id); };
      row.appendChild(go);
    } else {
      const park=document.createElement('button'); park.className='btn';
      park.textContent='Visit Practice park →';
      park.onclick=()=>{ state.justCleared=null; goTo('revision'); };
      row.appendChild(park);
      const again=document.createElement('button'); again.className='btn ghost';
      again.textContent='🔁 Start again';
      again.onclick=()=>{ state.justCleared=null; state.confirmReset=true; render(); };
      row.appendChild(again);
    }
    box.appendChild(row);
    overlay.appendChild(box);
    app.appendChild(overlay);
    speak('Super!');
  }

  if(state.confirmReset){
    const overlay=document.createElement('div'); overlay.className='level-up';
    const box=document.createElement('div'); box.className='level-up-card';
    box.innerHTML=`<div class="burst">🔁</div>
      <h3>Start again?</h3>
      <p>This clears every star. You will begin at Level 1 — Hallo. Locked path or Free play stays as you left it. Simba will pretend this is a brand-new journey.</p>`;
    const row=document.createElement('div'); row.className='btnrow'; row.style.justifyContent='center';
    const cancel=document.createElement('button'); cancel.className='btn ghost'; cancel.textContent='Keep my stars';
    cancel.onclick=()=>{ state.confirmReset=false; overlay.remove(); };
    const yes=document.createElement('button'); yes.className='btn'; yes.textContent='Yes, start again';
    yes.onclick=()=>resetProgress();
    row.appendChild(cancel); row.appendChild(yes);
    box.appendChild(row);
    overlay.appendChild(box);
    app.appendChild(overlay);
  }
}

render();
['pointerdown','keydown'].forEach(ev=>{
  document.addEventListener(ev, ensureMusic, true);
});
ensureMusic();
